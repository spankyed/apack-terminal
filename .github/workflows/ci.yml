name: CI

# Every push to master and every pull request runs the checks on Linux and the suite on all three platforms.
# **All three is the point, not thoroughness**: everything in `crates/apack-os/src/tree_windows.rs`, ConPTY's
# missing EOF, its cursor-position request and `\r\n` submitting a line are reachable from no Mac, and every one
# of them was wrong before it was run on Windows (`CLAUDE.md`, "A platform claim is made on that platform"). A
# change to documentation alone runs nothing past `changes`, and a newer push to the same pull request cancels
# the run before it; `master` runs never cancel each other so a docs-only follow-up cannot supersede an
# unverified code commit. `ci-pass` is the one check a merge waits on. Mutants of a pull request's change run
# beside this in mutants.yml, which a surviving mutant fails.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether the change holds anything but documentation, which no check reads
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # A pull request's merge commit and its first parent, the base it merges into
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE; git fetch --depth=1 origin "$base" 2>/dev/null || base= ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && ! git diff --name-only "$base" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # The cheap checks and the repository's own, which need one platform: format, lint, generated protocol,
  # safety comments, third-party notices and mutant exclusions
  checks:
    name: checks (Linux x64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml names the toolchain; rustup installs it on first use
      - run: rustup show active-toolchain
      # **Only `master` saves a build cache; every run restores one.** A pull request's cache is readable by that
      # pull request alone, so saving one spends a gigabyte or more of the repository's ten on something no other
      # run can use, and the cache evicts by least recent use: `master`'s caches were what went. A pull request
      # restores `master`'s, which is the one that matches it best. The same in every workflow that builds
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo xtask check-generated
      - run: cargo xtask check-safety
      # The release's third-party notices, held to the lockfile, libghostty-vt's licenses and the toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: cargo xtask check-notices
      # **The mutation gate's own exclusions, checked where every change is checked.** A pattern matching no
      # mutant leaves the survivor it was written for reported while reading as a settled question, and the
      # gate cannot notice that about itself. It belongs here rather than in `mutants.yml`, whose jobs are
      # scoped to the Rust a change touches: an exclusion is edited in a `.toml`, which that scope skips.
      # The binary is installed for this one step; `install-action` fetches a prebuilt one.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: cargo xtask check-exclusions
      - run: cargo test --locked --workspace --doc

  # The suite on each platform the broker runs on. A pty, a process tree and a shell's own reports are the
  # platform's answers, so each one is asked here
  platforms:
    name: tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, runner: ubuntu-24.04 }
          - { name: macOS arm64, runner: macos-15 }
          - { name: Windows x64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      # **Windows and Linux build the terminal core, as their releases do.** The core's crate links a prebuilt
      # library where one exists for the target, Apple and Linux, and otherwise builds Ghostty at its pinned commit
      # with Zig, whose version has to be the one that commit wants. Nobody publishes one for Windows, and the Linux
      # one needs a newer glibc than the release is built for, so `binaries.yml` builds both from source: the suite
      # runs against that same build of the core, and not, on Linux, against a prebuilt one no release ships
      - if: runner.os != 'macOS'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # **And built for speed, as the library a Mac links was.** The crate otherwise follows this build's profile,
      # and a debug core under a debug suite is slow enough that the cases holding a hundred thousand lines of
      # history do not finish. Naming a mode at all is what tells the crate to build from source
      - if: runner.os != 'macOS'
        shell: bash
        run: echo "GHOSTTY_VT_RS_SYS_OPTIMIZE=fast" >> "$GITHUB_ENV"
      # Saved from `master` only, as in `checks`
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # **Windows is linted where it is built.** `checks` lints Linux, where `cfg(windows)` code and what only a
      # POSIX case uses look different: a helper only POSIX cases call is unused here, and nothing else says so
      - if: runner.os == 'Windows'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Each test in its own process, killed at `.config/nextest.toml`'s deadline: a regression here loses a
      # signal, which is a read that never returns rather than a wrong answer
      - run: cargo nextest run --locked --workspace --no-fail-fast

  # The view (`view/`): its types, its suite and the build a consumer bundles. One platform, since it is
  # TypeScript drawing on a canvas and nothing in it asks the operating system anything. Its suite reads
  # `node/wire-vectors-v2.json` where the broker's suite writes it, so a change to the wire that taught only
  # one half fails here or in `platforms`, in the same run
  view:
    name: view (Linux x64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: view
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The broker's npm package (`node/`): its runtime entry, which finds the binary in the platform package
  # installed beside it, and the release's packing of the platform packages, whose versions must be its own
  node:
    name: node (Linux x64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  # The one check a merge waits on: every job above passed or was skipped (a documentation-only change)
  ci-pass:
    if: always()
    needs: [changes, checks, platforms, view, node]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
