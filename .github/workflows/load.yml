name: load

# The cases whose work is the volume, run nightly and on a dispatch rather than on each push: each is
# `#[ignore]`d, so `ci.yml` builds them and runs none, and this runs only those (`--run-ignored only`).
#
# Today that is one Windows case: ten thousand commands in one PowerShell session, each start and finish a
# keyed mark through ConPTY, and the commands the broker keeps are the last of them, in order. A reordered or
# dropped mark gives a command history that is wrong with nothing failing, and only a run this long shows it.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  # A pull request that changes this file runs it, so the change is seen working before it is the nightly one
  pull_request:
    paths:
      - .github/workflows/load.yml

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: load (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      # The core is built from source on Windows, as in `ci.yml`'s `platforms`, and for speed
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - shell: bash
        run: echo "GHOSTTY_VT_RS_SYS_OPTIMIZE=fast" >> "$GITHUB_ENV"
      # Saved from `master` only, as in `ci.yml`
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --workspace --run-ignored only --no-fail-fast
