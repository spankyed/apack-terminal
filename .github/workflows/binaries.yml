name: binaries

# **The broker as the app consumes it: built once per commit, published, and pinned by hash.** The app runs the
# release build of a commit it pins, on each platform it ships for, and downloads it rather than building it —
# so what a developer's app runs and what CI tested are the same bytes, and nobody working on the app needs a
# Rust toolchain. Each `master` commit gets a release, `bin-<commit>`, holding every platform's files and a
# `SHA256SUMS`; the app's `npm run pin:apack-terminal -- <commit>` copies those sums into its pin, and its
# install verifies every file against them.
#
# **An asset is `<platform>__<file>`**: `<platform>` is Node's `<process.platform>-<process.arch>`, which is how
# the app names the one it is on, and `<file>` is the name the file takes beside the others — the binary, on
# Windows the ConPTY it loads from its own directory (`windows/conpty/`), the notices the binary's licenses ask a
# redistribution to carry, and its CycloneDX SBOM. A release has no folders, so the platform is in the name.
#
# **The Linux binary needs glibc 2.39 or later** (Ubuntu 24.04, Debian 13, Fedora 40), its runner's: the build fails
# when it needs a newer one, so a runner image moving on can't raise what the app's users need without a change here,
# and the app's own Linux release holds its binaries to the same floor (its build-linux.yml).
#
# A dispatch builds a commit that has none, such as one from before this workflow.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to build and publish binaries for
        required: true

permissions:
  contents: write

concurrency:
  group: binaries-${{ inputs.commit || github.sha }}
  cancel-in-progress: false

env:
  COMMIT: ${{ inputs.commit || github.sha }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15, binary: apack-terminal, target: aarch64-apple-darwin }
          - { platform: linux-x64, runner: ubuntu-24.04, binary: apack-terminal, target: x86_64-unknown-linux-gnu }
          - { platform: win32-x64, runner: windows-latest, binary: apack-terminal.exe, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - run: rustup show active-toolchain
      # As `ci.yml`'s tests job: Windows builds the terminal core from source with the Zig its commit wants, for
      # speed; the other platforms link the prebuilt library
      - if: runner.os == 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - if: runner.os == 'Windows'
        shell: bash
        run: echo "GHOSTTY_VT_RS_SYS_OPTIMIZE=fast" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo build --release --locked --bin apack-terminal
      # The newest glibc symbol version the Linux binary needs, held to the floor stated above
      - if: runner.os == 'Linux'
        run: |
          floor=2.39
          newest=$(nm -D --undefined-only target/release/${{ matrix.binary }} | grep -o '@GLIBC_[0-9.]*' | sed 's/@GLIBC_//' | sort -uV | tail -1)
          echo "the binary needs glibc ${newest:-(none read)}; the floor is $floor"
          if [ -z "$newest" ] || [ "$(printf '%s\n%s\n' "$newest" "$floor" | sort -V | tail -1)" != "$floor" ]; then
            echo "::error::The broker needs glibc ${newest:-(none read)}, past the floor $floor this workflow states"
            exit 1
          fi
      # **The binary's SBOM**, CycloneDX: every crate its target is built from, as cargo-cyclonedx reads them from the
      # lockfile, build scripts' dependencies left out and procedural macros, which run while it compiles, kept in.
      # What isn't a crate it lists nowhere: libghostty-vt's C and Zig libraries, which a crate links prebuilt, and on
      # Windows the ConPTY files shipped beside the binary (`conpty.dll`, `OpenConsole.exe`). THIRD-PARTY-NOTICES
      # credits them (`licenses/README.md`)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.10
      - name: SBOM
        shell: bash
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --no-build-deps --target ${{ matrix.target }}
      # The binary, and whatever `build.rs` put beside it that the npm package ships with it (the ConPTY on
      # Windows): what `cargo xtask package` stages, renamed for a release that has no folders
      - name: Collect this platform's files
        shell: bash
        run: |
          mkdir -p out
          for file in ${{ matrix.binary }} conpty.dll OpenConsole.exe; do
            if [ -f "target/release/$file" ]; then cp "target/release/$file" "out/${{ matrix.platform }}__$file"; fi
          done
          # **The notices go with each platform's binary**, which their licenses ask a binary redistribution to
          # carry: the crates', libghostty-vt's code's and ConPTY's, the Rust standard library's, and the broker's
          # own (`cargo xtask check-notices` holds the first two to the lockfile and the toolchain). Named like the
          # binary, so the app's pin lists them and its install puts them beside it. A commit from before the
          # notices has only the license files, and its release is published with those alone
          for file in THIRD-PARTY-NOTICES COPYRIGHT-rust-library.html LICENSE-MIT LICENSE-APACHE; do
            if [ -f "$file" ]; then cp "$file" "out/${{ matrix.platform }}__$file"; fi
          done
          cp apack-terminal_bin.cdx.json "out/${{ matrix.platform }}__apack-terminal.cdx.json"
          ls -l out
          test -f "out/${{ matrix.platform }}__${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: out
      - name: Sums
        working-directory: out
        run: sha256sum -- * | tee SHA256SUMS
      # **A release per commit, written once.** One that is published keeps its files: the pin of every app that
      # copied its sums is to those bytes, and replacing them would break each of those installs. A draft is what a run
      # stopped mid-upload leaves, which nobody can have pinned, so it is made again. Any other failure to read the
      # release fails the step, rather than passing as a release that isn't there
      - name: Publish bin-${{ env.COMMIT }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="bin-$COMMIT"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2> view.err); then
            if [ "$draft" != true ]; then
              echo "$tag is already published; leaving its files as they are"
              exit 0
            fi
            echo "$tag is a draft a run before left; making it again"
            gh release delete "$tag" --yes
          elif ! grep -q 'release not found' view.err; then
            cat view.err
            exit 1
          fi
          gh release create "$tag" out/* --target "$COMMIT" --title "binaries for ${COMMIT:0:7}" \
            --latest=false --notes "The broker's release build of $COMMIT for each platform the app ships, with SHA256SUMS and the notices its licenses ask a redistribution to carry. Pinned by apack, never replaced."
