name: fuzz

# The parsers that read untrusted bytes, fuzzed: every target in `fuzz/fuzz_targets/` runs for a bounded time
# on Linux under nightly (libFuzzer needs its sanitizer coverage). A crash fails the job and uploads its input,
# which reproduces with `cargo +nightly fuzz run <target> <file>`.
#
# It runs nightly and on a dispatch, not on each push: a fuzz run is a fixed budget of CPU, and a regression a
# short run would catch is what `cargo test` already covers. The budget is per target, so the job's time is the
# number of targets, not their size.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "1200"
        required: true

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # To find and download the corpus an earlier run uploaded
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: [frames, view_wire, markers, png, recording]
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # **The corpus is carried from run to run as an artifact, not in the Actions cache.** A run starts from the
      # inputs earlier runs found interesting, which is what lets the deep targets reach further each night. The
      # cache is shared with the Rust build caches and evicts by least recent use, so a corpus kept there is gone
      # by the next night whenever the day's builds fill it; an artifact is stored apart and kept for its
      # retention. The newest one the default branch's runs uploaded is the one taken, so a dispatch on a branch
      # starts from the nightly corpus and never feeds its own back. None found is the first run: the seeds alone.
      - name: Download corpus
        working-directory: fuzz
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: fuzz-corpus-${{ matrix.target }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p corpus/${{ matrix.target }}
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" --jq \
            "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BRANCH\")]
             | sort_by(.created_at) | last | .id // empty")"
          if [ -z "$id" ]; then
            echo "no earlier corpus for ${{ matrix.target }}: starting from the seeds"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/corpus.zip"
          unzip -q -o "$RUNNER_TEMP/corpus.zip" -d corpus/${{ matrix.target }}
          echo "starting from $(find corpus/${{ matrix.target }} -type f | wc -l) inputs, artifact $id"

      - name: Fuzz
        working-directory: fuzz
        run: |
          # The run grows corpus/; seeds/ is read as well and never written, so the seeds stay the tracked ones
          # Named explicitly: the prebuilt cargo-fuzz defaults to the musl target, which the sanitizer cannot use
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.seconds || '1200' }}

      # Also after a crash: the corpus holds the inputs that found new code, and the one that crashed is in
      # artifacts/, not here. Fourteen days covers a run of missed nights; past that a run starts from the seeds
      - name: Upload corpus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
