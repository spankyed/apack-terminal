name: asan

# The broker's suite under AddressSanitizer on a native x86_64 Linux runner. The Mac's Linux container runs
# arm64 natively and x86_64 under emulation, where the sanitizer reports addresses the emulator, not the
# broker, produced. It runs with every change, as the mutants do: the broker's unsafe code and the VT library it
# calls into are where a memory error would land, and the sanitizer finds one where the tests pass over it.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  asan:
    name: AddressSanitizer (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # Saved from `master` only, as every workflow here does: a branch's cache serves that branch alone
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: the suite under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo +nightly test --target x86_64-unknown-linux-gnu --test suite --no-fail-fast
