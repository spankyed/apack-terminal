name: mutants

# Mutants of what a change changes, against the broker's own suite: a survivor fails the job, reported on its
# line and in the job's summary. A run is scoped to the change (`--in-diff`), because a whole-repository run
# is minutes of mutants nobody edited and a survivor outside the change is not this change's to answer for.
# `cargo xtask pre-push` runs the same thing before a push, so a survivor is normally found before CI sees it.
#
# Windows-only code is mutated on Windows, and nowhere else: `src/tree.rs`'s Job Objects and every
# `cfg(windows)` arm compile on no other platform, so a Linux run reports every one of their mutants as
# unviable. A change with none installs nothing there.
#
# **It runs on a push too, and that is not belt and braces.** This repository's work lands on `master`
# directly, so a gate that fires only on a pull request had never fired at all — and `.cargo/mutants.toml`
# says this job is what answers `src/tree.rs`. A claim about where a check is made has to be true of the
# record and not only of the design. The Linux half duplicates `cargo xtask pre-push` and is cheap; the
# Windows half is the one no developer here can run, which is the point of having it.
#
# **A dispatch is for a file rather than a change**, which is how Windows-only code gets answered at all:
# `src/tree.rs` is `#[cfg(windows)]` in its entirety and is excluded from no run, so until something mutates
# it on Windows its mutants are missed everywhere. The Linux half sits a dispatch out, since a
# whole-repository Linux run would report exactly those as missed.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      files:
        description: The files to mutate on Windows, space separated
        default: src/tree.rs
        required: true

concurrency:
  # One per pull request, or per push. **A pass that has started finishes**: a push to a pull request
  # waits for the one running and replaces only one that was still waiting. Cancelling on every push
  # meant a branch pushed to more often than a pass takes was never mutated at all
  group: mutants-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # **The change's mutants, dealt out across runners.** A mutant is a build and a run of the suite, and
  # they are independent of each other, so the time a pass takes is the number of mutants over the number
  # of runners. Dealt round-robin rather than in runs: consecutive mutants are in one file, and a file
  # whose mutants are slow would otherwise all land on one runner. A change with fewer mutants than
  # shards leaves some with none, which pass having had nothing to do.
  shard:
    name: mutants in the change (Linux, shard ${{ matrix.shard }} of 8)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      # Every shard's survivors are wanted, not the first shard's
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      # Deep, because the base a change is measured against is the merge base or a pushed-over commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: |
          git diff $(bash .github/base.sh) -- '*.rs' > change.diff
          if [ -s change.diff ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "The change touches no Rust" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.scope.outputs.code == 'true'
        run: rustup show active-toolchain
      - if: steps.scope.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.scope.outputs.code == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.148
      # Exit 3 is a timeout, which is the suite's deadline catching a mutant rather than a survivor — the
      # credit-accounting mutants in `output.rs` hang the writer by design. It is also what a run with a
      # timeout *and* a survivor exits with, so the survivors are read from the list rather than the code.
      # Two at a time: a runner has four cores, and the suite under one mutant uses more than one
      - if: steps.scope.outputs.code == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cargo mutants --in-diff change.diff --shard "$SHARD/8" --sharding round-robin --jobs 2 || [ $? = 3 ]
          if [ -s target/mutants.out/missed.txt ]; then cat target/mutants.out/missed.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.code == 'true'
        with:
          name: mutants-in-diff-linux-${{ matrix.shard }}
          path: target/mutants.out
          if-no-files-found: ignore

  # One name for the eight, so whatever requires this check requires all of them
  linux:
    name: mutants in the change (Linux)
    if: always() && github.event_name != 'workflow_dispatch'
    needs: shard
    runs-on: ubuntu-24.04
    steps:
      - env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "The shards: $SHARDS"
          [ "$SHARDS" = success ]

  windows:
    name: mutants in the change (Windows-only code)
    runs-on: windows-latest
    env:
      # Built for speed, as the library every other platform links was (`ci.yml`)
      GHOSTTY_VT_RS_SYS_OPTIMIZE: fast
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A dispatch names its files; a push or a pull request contributes only the files whose mutants this
      # platform is the one that can answer, so a change with none installs nothing here
      - id: scope
        # Through the environment rather than interpolated into the script: a dispatch input is a string
        # somebody typed, and `${{ }}` would paste it into a shell
        env:
          WANTED: ${{ inputs.files }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            printf 'Mutating %s\n' "$WANTED" >> "$GITHUB_STEP_SUMMARY"
            args=""
            for file in $WANTED; do args="$args --file $file"; done
            echo "args=$args" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(bash .github/base.sh)"
          # **The files whose mutants only Windows can answer**, which is what this job is for. A file like
          # `src/session.rs` holds Windows arms and POSIX code together, and `#[cfg(unix)]` code is not
          # compiled here — so a mutation of it changes nothing, the suite passes, and the mutant is
          # reported missed. A job scoped to the whole change is red whenever POSIX-only code moves, and
          # says nothing about Windows either way.
          #
          # A mixed file's Windows arms are answered by a dispatch (`-f files=src/session.rs`): nothing here
          # can tell a Windows mutant from a POSIX one inside one file, and a developer naming the file is
          # the claim being made deliberately rather than by a grep.
          windows_only="src/tree.rs"
          mapfile -t files < <(git diff --name-only --diff-filter=d "$base" -- $windows_only)
          if [ ${#files[@]} -gt 0 ]; then
            args=""
            for file in "${files[@]}"; do args="$args --file $file"; done
            printf 'Mutating %s\n' "${files[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "args=$args" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "The change touches no file whose mutants need Windows; dispatch with -f files=… for one" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.scope.outputs.code == 'true'
        run: rustup show active-toolchain
      # The terminal core is built here, there being none published for Windows (`ci.yml`)
      - if: steps.scope.outputs.code == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - if: steps.scope.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.scope.outputs.code == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.148
      - if: steps.scope.outputs.code == 'true'
        env:
          ARGS: ${{ steps.scope.outputs.args }}
        run: |
          cargo mutants $ARGS || [ $? = 3 ]
          if [ -s target/mutants.out/missed.txt ]; then cat target/mutants.out/missed.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.code == 'true'
        with:
          name: mutants-in-diff-windows
          path: target/mutants.out
          if-no-files-found: ignore
