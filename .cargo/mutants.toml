# cargo-mutants: what it mutates and how it tests each mutant. A run is scoped to a change (`--in-diff`),
# which `cargo xtask pre-push` and `.github/workflows/mutants.yml` both do.

# The tests themselves, the deterministic chaos simulator harness (`apack-sim`), and the repository's
# own tasks (`xtask/`). None of these ship in the broker binary.
exclude_globs = [
    "tests/**",
    "xtask/**",
    "crates/apack-sim/**",
]
# Each test in its own process under `.config/nextest.toml`'s deadlines.
test_tool = "nextest"
# Stop on the first failing test per mutant for fast turnaround.
additional_cargo_test_args = ["--max-fail=1:immediate"]
timeout_multiplier = 3.0
output = "target"
profile = "mutants"

exclude_re = [
    # **`apack-vt-ghostty` proven-equivalent & ASAN-covered Drop exclusions:**
    # 1. Freeing exclusively-owned FFI handles and `CallbackBox` in `Drop` cannot be observed by
    #    functional tests (verified by AddressSanitizer in CI).
    "crates/apack-vt-ghostty/src/engine/mod.rs:.*<impl Drop for (GhosttyEngine|CallbackBox)>::drop",
    "crates/apack-vt-ghostty/src/input.rs:.*<impl Drop for InputEncoders>::drop",
    # 2. Boundary strictness (`<`/`<=`, `>`/`>=`) in Kitty placeholder aspect-ratio `fit`, where both
    #    branches compute the exact same floating-point value at the dividing boundary.
    "crates/apack-vt-ghostty/src/placeholders.rs:.*replace (<|>) with (<=|>=) in fit",
    # 3. `png` crate already rejects animated sub-frame PNGs whose first frame is smaller than the full
    #    image, so these defense-in-depth guards are always true for accepted inputs.
    "crates/apack-vt-ghostty/src/image_store.rs:.*replace match guard frame.buffer_size\\(\\) == pixels \\* (4|2) with true in decode_png_into",

    # **`apack-os` lethal-broadcast safety & proven-equivalent exclusions:**
    # 1. Mutating comparisons inside `KillTarget::at` allows `kill(0)`/`kill(-1)` broadcasts; mutating
    #    process selection inside `signal_session_descendants` sends SIGHUP/SIGKILL to unrelated host processes.
    "crates/apack-os/src/signal.rs:.*in KillTarget::at",
    "crates/apack-os/src/signal.rs:.*in signal_session_descendants",
    # 2. Disjoint single-bit POSIX/Win32/Ghostty flags produce identical bitmasks under `|` and `^`.
    "crates/apack-vt-ghostty/src/engine/render.rs:.*replace \\| with \\^ in GhosttyEngine::feed_inner",
    "crates/apack-os/src/transport.rs:.*replace \\| with \\^ in acquire_socket_hold",
    "crates/apack-os/src/transport.rs:.*replace \\| with \\^ in unix_signals::install_shutdown_signals",
    "crates/apack-os/src/image_sources/posix.rs:.*replace \\| with \\^",
    "crates/apack-os/src/pty_poller.rs:.*replace \\| with \\^ in create_nonblocking_pipe",
    "crates/apack-os/src/tree_windows.rs:.*replace \\| with \\^ in JobGuard::attach",
    "crates/apack-wal/src/blobs.rs:.*replace \\| with \\^ in open_regular_read_only",
    # 3. Testing a peer owned by another OS user or pipe access denial to another local account
    #    requires a second local OS account not present in CI.
    "crates/apack-os/src/transport.rs:.*replace verify_peer_is_current_user -> io::Result<bool> with Ok\\(true\\)",
    "crates/apack-os/src/transport.rs:.*replace verify_client_is_current_user -> io::Result<bool> with Ok\\(true\\)",
    "crates/apack-os/src/transport_windows.rs:.*replace owned_by_this_user -> io::Result<bool> with Ok\\(true\\)",
    "crates/apack-os/src/security_windows.rs:.*replace owner_only_security_descriptor -> io::Result<SecurityDescriptor> with Ok\\(Default::default\\(\\)\\)",
    # 4. macOS half-closed socket fallback (`Shutdown::Both || Shutdown::Write`) is unobservable on Linux
    #    where `Shutdown::Both` always succeeds.
    "crates/apack-os/src/transport.rs:.*replace \\|\\| with && in hang_up",
    # 5. Closing an exclusively-owned Win32 token handle or unmapping `MappedGuard` in `Drop` leaks
    #    a kernel resource not observable by functional assertions (verified by ASAN on Linux).
    "crates/apack-os/src/security_windows.rs:.*<impl Drop for TokenHandle>::drop",
    "crates/apack-os/src/image_sources/posix.rs:.*<impl Drop for MappedGuard>::drop",
]
