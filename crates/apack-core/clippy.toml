# Enforce sans-IO purity in `apack-core` even inside `#[cfg(test)]` code.
disallowed-types = [
    { path = "std::time::Instant", reason = "apack-core is sans-IO; use TimestampMs" },
    { path = "std::time::SystemTime", reason = "apack-core is sans-IO; use TimestampMs" },
    { path = "std::fs::File", reason = "apack-core is sans-IO; no filesystem access" },
    { path = "std::fs::OpenOptions", reason = "apack-core is sans-IO; no filesystem access" },
    { path = "std::net::TcpStream", reason = "apack-core is sans-IO; no network I/O" },
    { path = "std::net::TcpListener", reason = "apack-core is sans-IO; no network I/O" },
    { path = "std::net::UdpSocket", reason = "apack-core is sans-IO; no network I/O" },
    { path = "std::process::Command", reason = "apack-core is sans-IO; no process spawning" },
]

disallowed-methods = [
    { path = "std::thread::spawn", reason = "apack-core is sans-IO; no threads" },
    { path = "std::thread::sleep", reason = "apack-core is sans-IO; no sleeping" },
    { path = "std::env::var", reason = "apack-core is sans-IO; no process environment reads" },
    { path = "std::env::var_os", reason = "apack-core is sans-IO; no process environment reads" },
]
