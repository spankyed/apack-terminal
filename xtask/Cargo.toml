[package]
name = "xtask"
description = "The repository's own tasks: cargo xtask <task>"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tempfile = "3.27.0"
# For `vt-prebuilt`'s one digest. A platform branch between `shasum` and `sha256sum` is what this replaces,
# and neither is reliably present on the Windows VM where Phase B has to run this task.
sha2 = "0.10.9"

# The binary is the entry point and the library is what its own tests reach: `check-exclusions`'s decision
# is driven with counts of its own there, which is the only way to watch it fail without committing a dead
# pattern to the file it reads.
[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"
