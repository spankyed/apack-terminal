# Each test runs in its own process, so a test that hangs is killed at its deadline and the rest run on. That
# matters more here than the deadline being tight: nearly every suite waits on a frame the broker sends when
# something happened, and a regression that loses the signal is a blocking read that never returns rather
# than a wrong answer. Under `cargo test` one such test holds the whole run.

# What CI installs, and the oldest that reads this file as written
nextest-version = "0.9.148"

# The deadline is for a test that has stopped ending at all, so it is several times the slowest test
# rather than near it: `cargo nextest run` prints what each one took.
[profile.default]
slow-timeout = { period = "10s", terminate-after = 2 }

# The one test that waits for a producer to saturate the bounded channel and for the throttle to be reported:
# 7.2 s of real output on an Apple-silicon laptop, and the only test whose work is the volume rather than a round trip
[[profile.default.overrides]]
filter = "test(=channel::a_saturating_producer_reports_that_it_was_throttled_rather_than_losing_output)"
slow-timeout = { period = "30s", terminate-after = 2 }

# **ts-rs generates one `export_bindings_*` test per exported type, and every one of them writes the same
# file.** Under `cargo test` they were threads in one process and the writes interleaved harmlessly often
# enough; as separate processes they truncate and write `bindings/protocol.ts` on top of each other, and one
# of them reads back a file another had just emptied. It failed on the first full run after this file existed.
# A group of one thread is the fix rather than a lock in the tests: nothing about these is concurrent on
# purpose, and `cargo xtask generate` runs them for their side effect alone.
#
# **There is one profile on purpose.** A `[profile.ci]` whose only setting was `fail-fast = false` carried
# none of the overrides above — nextest does not merge a profile's overrides with the default's, which
# `cargo nextest show-config test-groups --profile ci` says plainly — so every CI job raced here while every
# local run was fine. `--no-fail-fast` is a flag, and a flag cannot silently lack an override.
[test-groups]
protocol-export = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(/^protocol::export_bindings_/)"
test-group = "protocol-export"

# **The two longest cases start first.** Each is seconds of real output by design, so left to the end
# they are what a whole run waits for after everything else has finished; started first they are over
# when the rest is. Above the override that puts their modules last, because the first override that
# matches a case is the one that sets its priority
[[profile.default.overrides]]
filter = "test(=channel::a_saturating_producer_reports_that_it_was_throttled_rather_than_losing_output) | test(=broker::a_client_that_stops_reading_stalls_the_program_rather_than_filling_the_broker)"
priority = 50

# **Of the rest, the cases that are a function call run before the ones that are a process.** A case that feeds a
# parser or reads a row back answers in milliseconds, and is what fails first for most of what can go
# wrong in this crate; the modules below start the real broker and a shell, and take the suite's whole
# length between them. Run in the order of their names, those came first — so a run that stops at its
# first failure, which a mutation run does once a mutant (`.cargo/mutants.toml`), waited through seconds
# of processes to reach a case that took none.
[[profile.default.overrides]]
filter = "test(/^(broker|candidates|channel|coalescing|housekeeping|keeping|proxy|view_broker)::/)"
priority = -50
