# Each test runs in its own process, so a test that hangs is killed at its deadline and the rest run on.
# Nearly every integration test waits on a frame or OS signal; a regression that loses a wake is a blocking
# read that never returns rather than a wrong answer. Under `cargo test`, one hung test holds the whole run.

# What CI installs, and the oldest that reads this file as written
nextest-version = "0.9.148"

# Default deadline for any test that stops making progress
[profile.default]
slow-timeout = { period = "10s", terminate-after = 2 }

# `apack-broker` and root `apack-terminal` CLI tests finish in < 1 s; an 8 s deadline catches hung mutants promptly.
[[profile.default.overrides]]
filter = "package(apack-broker) | package(apack-terminal)"
slow-timeout = { period = "4s", terminate-after = 2 }

# Fast pure unit & simulation tests run before tests that spawn real PTYs or broker processes so mutation runs
# fail as early as possible.
[[profile.default.overrides]]
filter = "package(apack-proto) | package(apack-core) | package(apack-sim)"
priority = 50

[[profile.default.overrides]]
filter = "package(apack-broker) | package(apack-terminal)"
priority = -50
