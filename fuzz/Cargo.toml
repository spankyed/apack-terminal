[package]
name = "apack-terminal-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.apack-proto]
path = "../crates/apack-proto"

[dependencies.apack-core]
path = "../crates/apack-core"

[dependencies.apack-wal]
path = "../crates/apack-wal"

[dependencies.apack-vt-ghostty]
path = "../crates/apack-vt-ghostty"

# Its own workspace, so cargo-fuzz's toolchain and flags stay here and the broker's build does not see them
[workspace]
members = ["."]

[[bin]]
name = "v2_wire"
path = "fuzz_targets/v2_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v2_wal"
path = "fuzz_targets/v2_wal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v2_vt"
path = "fuzz_targets/v2_vt.rs"
test = false
doc = false
bench = false
