# cargo-about's configuration for THIRD-PARTY-NOTICES, the licenses and notices of the crates the broker's release
# binaries are built from. `cargo xtask notices` writes the file and `cargo xtask check-notices` fails when it is
# stale; both pass the targets of the platforms `.github/workflows/binaries.yml` builds, so a dependency only one
# platform builds is listed. The default features are the ones read: the release is built with them.

# The licenses any dependency may be under, in the order one is chosen from a choice such as `MIT OR Apache-2.0`. A
# dependency under another fails the notices, so its license is read before it ships.
accepted = ["MIT", "Apache-2.0", "BSD-3-Clause", "Zlib", "Unicode-3.0", "0BSD"]

# Build scripts and tests run on the machine that builds the binary; nothing of theirs is in it
ignore-build-dependencies = true
ignore-dev-dependencies = true

# A clarification names what a crate's declared license leaves out, each file held to its checksum: a new version
# whose file differs fails the notices, and `notices` with it, until the clarification is read again.
#
# The broker's own license files. Named, because cargo-about otherwise reads every license file under the crate's
# directory, the repository, as the broker's own: the view's, ConPTY's and those of libghostty-vt's code, which
# `cargo xtask notices` gives under their own names after the crates.
[apack-terminal.clarify]
license = "MIT OR Apache-2.0"

[[apack-terminal.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "4eb4e32db6202b8f69f20d72654a29f3cee90b3154375df820b3c47805061e1c"

[[apack-terminal.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "1e02ee38d54daa90e27e8b3b89edfa3bb169543211c0eeccc522fb4f655a114e"

# The windows crates name their license files in lower case, which cargo-about doesn't find, and so would drop
# Microsoft's copyright. Every one of them ships the same two files. Most are sysinfo's Windows dependencies, which no
# release binary holds, since only the unix build uses sysinfo; cargo-about lists them from the targets alone, which
# credits more than is shipped, never less.

[windows.clarify]
