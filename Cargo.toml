# The broker is the only crate shipped; `xtask` is the repository's own tasks (`cargo xtask <task>`), which
# are a member rather than a script so they are compiled and type-checked with everything else.
[workspace]
members = ["xtask"]
resolver = "3"

[package]
name = "apack-terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
interprocess = "2.4.7"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12.0.1"

# Windows only: Job Objects, which is how a session owns its process tree there (`src/tree.rs`). POSIX needs
# none — the kernel's SIGHUP to a pty's foreground group does it.
# POSIX only: the name of the process reading a session's pty. The pid comes from `portable-pty`, whose
# `process_group_leader` is `#[cfg(unix)]`, so there is nothing to turn into a name on Windows and this
# would otherwise pull the `windows` crate into that build for a call it cannot make.
[target.'cfg(unix)'.dependencies]
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
# POSIX only: the signal numbers a `Signal` request names, and the system's own description of a signal, which
# is what `portable-pty` hands back for a child that was killed and what naming it again has to be inverted
# from. Windows has neither, and a `Signal` request is refused there.
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading"] }
# The SDDL string the pipe's security descriptor is built from, which `interprocess` takes as a `U16CStr`
widestring = "1.0.2"

# **Phase 0a's spike, off by default.** `libghostty-vt` is the VT core this broker is being measured
# against (`docs/goals/goal-one-vt-core.md` in the monorepo): one implementation parsing a session's bytes
# instead of two that can disagree. The feature exists so the comparison can be built and run without the
# default build acquiring a native archive, and it goes away with the measurement — either because the core
# replaces `alacritty_terminal`, or because 0a said no and the dependency comes back out.
#
# **The crate is bindings only and brings no build of its own**: its bindgen output is committed, so nothing
# runs `libclang`, and it links a prebuilt static library that `cargo xtask vt-prebuilt` fetches and
# verifies. `GHOSTTY_VT_RS_SYS_BUILD=prebuilt` makes a build-from-source a refusal rather than a silent
# attempt that needs a Zig this repository does not pin.
[features]
ghostty = ["dep:ghostty-vt-rs-sys"]

[dependencies.ghostty-vt-rs-sys]
version = "0.3.0"
optional = true

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"

# POSIX only: `tests/broker.rs`'s liveness probe asks with signal 0, which Windows has no equivalent for and
# answers there by asking the OS's own task list instead.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

# What cargo-mutants builds each mutant with (`.cargo/mutants.toml`): a debug build without the debug info,
# since nothing debugs a mutant and each one is a fresh copy of the build directory
[profile.mutants]
inherits = "dev"
debug = false
