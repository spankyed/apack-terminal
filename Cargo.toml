# The broker is the only crate shipped; `xtask` is the repository's own tasks (`cargo xtask <task>`), which
# are a member rather than a script so they are compiled and type-checked with everything else.
[workspace]
members = ["xtask"]
exclude = ["fuzz"]
resolver = "3"

[package]
name = "apack-terminal"
version = "0.1.0"
edition = "2024"
# One test program, whose modules are the files under `tests/` (`tests/suite.rs` on why)
autotests = false

[[test]]
name = "suite"
path = "tests/suite.rs"

# P1: the broker's numbers as a client drives it (`benches/broker.rs`). Reports, never fails
[[bench]]
name = "broker"
path = "benches/broker.rs"
harness = false

[dependencies]
interprocess = "2.4.7"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12.0.1"
# Decodes a PNG a program sends as an image, which the VT core leaves to whoever embeds it (`src/vt/images.rs`)
png = "0.18.1"

# Windows only: Job Objects, which is how a session owns its process tree there (`src/tree.rs`). POSIX needs
# none — the kernel's SIGHUP to a pty's foreground group does it.
# POSIX only: the name of the process reading a session's pty. The pid comes from `portable-pty`, whose
# `process_group_leader` is `#[cfg(unix)]`, so there is nothing to turn into a name on Windows and this
# would otherwise pull the `windows` crate into that build for a call it cannot make.
[target.'cfg(unix)'.dependencies]
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
# POSIX only: the signal numbers a `Signal` request names, and the system's own description of a signal, which
# is what `portable-pty` hands back for a child that was killed and what naming it again has to be inverted
# from. Windows has neither, and a `Signal` request is refused there.
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading"] }
# The SDDL string the pipe's security descriptor is built from, which `interprocess` takes as a `U16CStr`
widestring = "1.0.2"

# **The VT core.** `libghostty-vt` parses a session's bytes here. The window draws with an emulator of its
# own, built from the same project at another commit, so the two are related and not identical: where
# they differ this one is the authority, and `screen.rs` sets the defaults the window's has.
#
# **The crate is bindings only and brings no build of its own**: its bindgen output is committed, so nothing
# runs `libclang`, and it links a static library this repository supplies rather than one the build makes.
# `GHOSTTY_VT_RS_SYS_BUILD=prebuilt` makes a build from source a refusal rather than a silent attempt
# needing a Zig this repository does not pin, and with `GHOSTTY_VT_RS_SYS_PREBUILT_DIR` set the build
# fetches nothing at all.
#
# **Where that library comes from is not the same on every target.** On the targets upstream or the crate
# publish one, `cargo xtask vt-prebuilt` fetches the archive and verifies it against the checksum the crate
# pins. **For Windows nobody publishes one**, so it is built from the release's signed source and dependency
# tarballs with Zig 0.17.0 and `--system` — out of band, once, never during a build here. Two things about
# the crate make that less tidy than it reads, both measured: its source build passes `zig build` a
# `--global-cache-dir` that Zig 0.17.0 rejects, and `GHOSTTY_VT_RS_SYS_PREBUILT_DIR` asserts a
# `lib/libghostty-vt.a` that no Windows build produces, Zig installing `ghostty-vt-static.lib` — which is
# the name the crate's own link directive uses on that target.
[dependencies.ghostty-vt-rs-sys]
version = "0.3.0"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"

# POSIX only: `tests/broker.rs`'s liveness probe asks with signal 0, which Windows has no equivalent for and
# answers there by asking the OS's own task list instead.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

# What cargo-mutants builds each mutant with (`.cargo/mutants.toml`): a debug build without the debug info,
# since nothing debugs a mutant and each one is a fresh copy of the build directory
[profile.mutants]
inherits = "dev"
debug = false
