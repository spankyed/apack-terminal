# The workspace: modular sans-IO v2 crates plus the shipped `apack-terminal` broker binary and
# repository `xtask` automation (`cargo xtask <task>`).
[workspace]
members = [
    ".",
    "xtask",
    "crates/apack-proto",
    "crates/apack-core",
    "crates/apack-sim",
    "crates/apack-vt-ghostty",
    "crates/apack-os",
    "crates/apack-wal",
    "crates/apack-broker",
]
exclude = ["fuzz"]
resolver = "3"

[package]
name = "apack-terminal"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
apack-broker = { path = "crates/apack-broker" }
apack-os = { path = "crates/apack-os" }
apack-proto = { path = "crates/apack-proto" }

[dev-dependencies]
apack-core = { path = "crates/apack-core" }
tempfile = "3.27.0"

# **The PNG decoder and memchr are built optimised in debug/test builds too**: they are pure
# dependencies compiled once and never mutated, keeping test & mutation runs fast.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3

# Mild optimisation for test builds so heavy VT/WAL/simulation tests stay fast under nextest deadlines.
[profile.test]
opt-level = 1

# Profile used by cargo-mutants (`.cargo/mutants.toml`): no debug info for fast mutant rebuilds.
[profile.mutants]
inherits = "dev"
debug = false
